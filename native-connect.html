<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fffdf9">
  <title>Wakeup Buddy · Stimmen verbinden</title>
  <style>
    @font-face{font-family:Baloo;src:url('assets/font.woff2') format('woff2');font-weight:400 800;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#fffaf0,#fffdfb 38%,#f4f0fa);color:#35293f;font-family:Baloo,Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:28px 24px}main{width:min(100%,380px);text-align:center}img{width:160px;height:160px;object-fit:contain}h1{font-size:30px;line-height:1.15;font-weight:650;margin:20px 0 14px}p{font-size:16px;line-height:1.5;color:#74627e;margin:14px 0 24px}button,.open-app{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:14px;background:#ffb100;color:#35293f;font:600 16px Baloo,Arial,sans-serif;text-decoration:none;padding:12px 16px;cursor:pointer}button:disabled{opacity:.6}.cancel{display:block;text-align:center;min-height:44px;margin-top:12px;color:#74627e;text-decoration:none;font-size:14px}#verification{margin:18px 0}#status{font-size:14px;overflow-wrap:anywhere}[hidden]{display:none!important}
  </style>
  <script type="module" src="native-connect.js"></script>
</head>
<body>
<main>
  <img src="assets/felt-sun.png" alt="Lumi">
  <h1>Stimmen für deinen Morgen.</h1>
  <p>Verbinde die Android-App mit denselben sechs Stimmen und der Recherche von Wakeup Buddy.</p>
  <button id="connect" disabled>Verbinden</button>
  <div id="verification"></div>
  <a id="open-app" class="open-app" hidden>Wakeup Buddy öffnen</a>
  <a id="cancel" class="cancel" hidden>Zurück zur App</a>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
